generations:
  - name: "First Generation (2020-2023)"
    start_year: 2020
    end_year: 2023
    description: "The Cupra Leon Sportstourer is the estate/wagon variant of the Cupra Leon, representing the first generation of this body style under SEAT's performance-oriented Cupra sub-brand. Launched in January 2020, it is built on Volkswagen Group's MQB Evo platform (model codes KL1/KL8), which it shares with the Volkswagen Golf Mk8, Audi A3 Mk4, and Škoda Octavia Mk4. The estate variant combines the aggressive styling of the Cupra Leon hatchback with the added practicality of an estate body. Distinctive design elements include copper accents, dark trim pieces, quad exhaust outlets, and sportier bumpers and side skirts. The Sportstourer offers 617 liters of boot space (30 liters more than the previous generation), significantly more than the hatchback's 380 liters, making it practical for enthusiasts who need extra cargo capacity. Powertrain options include a 2.0L TSI petrol engine with 242 HP or 296 HP outputs, with the most powerful variant (306 HP ST 4Drive) featuring 4-wheel drive. A plug-in hybrid variant (eHybrid) combines a 1.4L TSI engine with an electric motor for a combined output of 242 HP and approximately 60 km (37 miles) of electric-only range. The interior features sports seats with copper stitching, a digital cockpit, 10-inch infotainment touchscreen, and ambient lighting. Performance enhancements include sports suspension, progressive steering, and larger brakes with Brembo calipers. The Cupra Leon Sportstourer offers a compelling combination of performance, distinctive styling, and practical utility, positioned as a more exclusive alternative to mainstream performance estates."
  - name: "First Generation (2024 Facelift)"
    start_year: 2024
    end_year: null
    description: "The Cupra Leon Sportstourer received a facelift in 2024 that adopts the new Tavascan design language. This update represents a visual and technical refresh of the same underlying MQB Evo platform while maintaining the estate body style and performance focus. The facelift introduces updated exterior styling including revised front and rear bumpers, new headlight and taillight designs reflecting Cupra's updated design direction. Performance and powertrain options remain similar to the pre-facelift model, with 2.0L TSI petrol engines available in 242 HP and 296 HP outputs, with the range-topping ST 4Drive producing 306 HP. The plug-in hybrid eHybrid option continues with 242 HP combined output. The refresh maintains the practical 617-liter boot space and reinforces Cupra's positioning as a standalone performance brand offering emotionally engaging vehicles that blend driving dynamics with everyday usability."
